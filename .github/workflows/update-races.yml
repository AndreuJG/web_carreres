name: Actualitzar carreres

on:
  schedule:
    # 05:17 UTC: 06:17 a l'hivern i 07:17 a l'estiu en Europe/Madrid.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-races.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: daily-race-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'AndreuJG/web_carreres' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Instal·lar dependències fixades
        run: npm ci
      - name: Comprovar els lectors abans de consultar les fonts
        run: npm test
      - name: Consultar fonts i preparar el catàleg
        id: sync
        continue-on-error: true
        run: npm run sync
      - name: Validar i compilar el catàleg resultant
        run: npm run build && npm test
      - name: Publicar només els dos fitxers de dades validats
        run: node scripts/publish-sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Guardar l'informe de la consulta
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-report
          path: reports/sync.json
          retention-days: 14
          if-no-files-found: warn
      - name: Indicar una fallada total de l'actualització
        if: steps.sync.outcome == 'failure'
        run: exit 1
