name: Novetats de carreres en Telegram

on:
  schedule:
    # Hourly wake-ups avoid depending on a single delayed daily trigger.
    # The sender uses Europe/Madrid to publish from 10:00 until 21:59.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Acció de Telegram
        type: choice
        default: preview
        options:
          - preview
          - test
          - send
          - confirm-delivery
          - retry-delivery
  workflow_run:
    workflows: ['Actualitzar carreres']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: telegram-race-digest
  cancel-in-progress: false

jobs:
  digest:
    if: >-
      github.repository == 'AndreuJG/web_carreres' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == 'AndreuJG/web_carreres'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Preparar i publicar les novetats
        run: node scripts/telegram/send.mjs "$TELEGRAM_MODE"
        env:
          TELEGRAM_MODE: ${{ inputs.mode || 'send' }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
